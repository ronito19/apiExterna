<section class="container">
    <div class="row">
        <figure class="col-12 col-md-3">
            <img class="img-fluid" [src]="elUsuario.image" [alt]="elUsuario.first_name">
        </figure>
        <div class="col-12 col-md-9"></div>
        <h1 class="text-dark">{{elUsuario.first_name}}</h1>
        <h1 class="text-dark">{{elUsuario.last_name}}</h1>
        <h3 class="text-dark">Nombre usuario: {{elUsuario.username}}</h3>
        <h3 class="text-dark">Email: {{elUsuario.email}}</h3>
        <button>Eliminar</button>
        <button>Actualizar</button>
        <button>Volver a listado</button>
    </div>
</section>
